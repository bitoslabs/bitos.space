<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <title>Page not found — bitos.space</title>
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const light =
          saved === "light" ||
          (!saved && window.matchMedia("(prefers-color-scheme: light)").matches);
        if (light) document.documentElement.classList.add("light-mode");
      } catch {
        /* storage unavailable */
      }
    </script>
    <script>
      (function () {
        var match = location.pathname.match(/^\/p\/([^/]+)\/?$/);
        if (!match) return;
        var target = "/p/";
        try {
          var params = new URLSearchParams(location.search);
          params.set("ref", decodeURIComponent(match[1]));
          target = "/p/?" + params.toString();
        } catch (error) {
          /* keep /p/ */
        }
        location.replace(target);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0b;
        --text: #f8f9fa;
        --muted: #a0a0a0;
        --link: #a78bfa;
        --focus: #8b5cf6;
      }
      html.light-mode {
        color-scheme: light;
        --bg: #f8f9fa;
        --text: #0b0b0b;
        --muted: #4b4f56;
        --link: #6d28d9;
        --focus: #6d28d9;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 520px;
        text-align: center;
      }
      h1 {
        font-size: clamp(28px, 5vw, 44px);
        margin: 0 0 12px;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--muted);
        line-height: 1.65;
        margin: 0 0 22px;
      }
      a {
        color: var(--link);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        That address does not exist. Profiles live under
        <code>bitos.space/p/</code>.
      </p>
      <p>
        <a href="/">Home</a> &nbsp;·&nbsp;
        <a href="/p/">Open profiles</a>
      </p>
    </main>
  </body>
</html>
