<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" role="img" aria-labelledby="title">
  <title id="title">BitOS bee</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffd521"/>
      <stop offset="0.55" stop-color="#ffbd08"/>
      <stop offset="1" stop-color="#f69a08"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#d1c9b5"/>
      <stop offset="1" stop-color="#a79d8e"/>
    </linearGradient>
    <clipPath id="bodyClip"><path d="M155 123 C111 123 84 151 84 192 C84 238 111 267 155 284 C199 267 226 238 226 192 C226 151 199 123 155 123Z"/></clipPath>
    <style>
      .bee { transform-origin: 155px 155px; animation: float 2.6s ease-in-out infinite; }
      .wing-left { transform-origin: 100px 144px; animation: flap-left .18s ease-in-out infinite alternate; }
      .wing-right { transform-origin: 210px 144px; animation: flap-right .18s ease-in-out infinite alternate; }
      @keyframes float { 0%, 100% { transform: translateY(3px) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
      @keyframes flap-left { from { transform: rotate(-5deg) scaleY(1); } to { transform: rotate(12deg) scaleY(.72); } }
      @keyframes flap-right { from { transform: rotate(5deg) scaleY(1); } to { transform: rotate(-12deg) scaleY(.72); } }
      @media (prefers-reduced-motion: reduce) { .bee, .wing-left, .wing-right { animation: none; } }
    </style>
  </defs>
  <g class="bee">
    <g class="wing-left"><path d="M107 135 C70 94 32 95 22 122 C10 155 50 182 98 175 C108 158 111 145 107 135Z" fill="url(#wing)" stroke="#ffe3a8" stroke-width="6"/></g>
    <g class="wing-right"><path d="M203 135 C240 94 278 95 288 122 C300 155 260 182 212 175 C202 158 199 145 203 135Z" fill="url(#wing)" stroke="#ffe3a8" stroke-width="6"/></g>
    <g fill="none" stroke-linecap="round"><path d="M137 49 Q128 30 112 19 M173 49 Q182 30 198 19" stroke="#0b0b0b" stroke-width="15"/><path d="M137 49 Q128 30 112 19 M173 49 Q182 30 198 19" stroke="url(#gold)" stroke-width="9"/></g>
    <circle cx="108" cy="16" r="10" fill="url(#gold)"/><circle cx="202" cy="16" r="10" fill="url(#gold)"/>
    <path d="M155 123 C111 123 84 151 84 192 C84 238 111 267 155 284 C199 267 226 238 226 192 C226 151 199 123 155 123Z" fill="url(#gold)" stroke="#0b0b0b" stroke-width="10"/>
    <g clip-path="url(#bodyClip)" fill="none" stroke="#0b0b0b"><path d="M82 190 Q155 152 228 190" stroke-width="25"/><path d="M88 231 Q155 194 222 231" stroke-width="27"/></g>
    <path d="M157 158 L173 159 L161 184 L181 184 L145 227 L156 199 L135 199 Z" fill="url(#gold)"/>
    <circle cx="155" cy="89" r="49" fill="#0b0b0b"/><circle cx="155" cy="89" r="39" fill="url(#gold)"/>
    <circle cx="137" cy="89" r="9" fill="#0b0b0b"/><circle cx="173" cy="89" r="9" fill="#0b0b0b"/>
  </g>
</svg>
