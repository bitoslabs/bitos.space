<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 423.224 292.278" role="img" aria-labelledby="title">
  <title id="title">BitOS bee</title>
  <defs>
    <linearGradient id="bee_gold" x1="285.411" y1="39.994" x2="288.857" y2="164.922" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7b506"/>
      <stop offset="0.5246" stop-color="#f59f10"/>
      <stop offset="0.9995" stop-color="#f28919"/>
    </linearGradient>
    <style>
      .bee-float {
        transform-origin: 199.6px 134.1px;
        will-change: transform;
        animation: bee-float 4.2s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }
      .bee-wing-left {
        transform-origin: 116.1px 110px;
        will-change: transform;
        animation: bee-flap-left 0.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .bee-wing-right {
        transform-origin: 283.1px 110px;
        will-change: transform;
        animation: bee-flap-right 0.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes bee-float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(0.8deg); }
      }
      @keyframes bee-flap-left {
        0%, 100% { transform: rotate(0deg) scaleY(1); }
        25% { transform: rotate(4deg) scaleY(0.96); }
        75% { transform: rotate(-2.5deg) scaleY(0.98); }
      }
      @keyframes bee-flap-right {
        0%, 100% { transform: rotate(0deg) scaleY(1); }
        25% { transform: rotate(-4deg) scaleY(0.96); }
        75% { transform: rotate(2.5deg) scaleY(0.98); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bee-float, .bee-wing-left, .bee-wing-right { animation: none; }
      }
    </style>
  </defs>
