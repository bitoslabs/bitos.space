<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — bitos.space</title>
    <script>
      (function () {
        var match = location.pathname.match(/^\/p\/([^/]+)\/?$/);
        if (!match) return;
        var target = "/p/";
        try {
          var params = new URLSearchParams(location.search);
          params.set("ref", decodeURIComponent(match[1]));
          target = "/p/?" + params.toString();
        } catch (error) {
          /* keep /p/ */
        }
        location.replace(target);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0b;
        color: #f8f9fa;
        font-family: Inter, system-ui, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 520px;
        text-align: center;
      }
      h1 {
        font-size: clamp(28px, 5vw, 44px);
        margin: 0 0 12px;
        letter-spacing: -0.02em;
      }
      p {
        color: #a0a0a0;
        line-height: 1.65;
        margin: 0 0 22px;
      }
      a {
        color: #a78bfa;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        That address does not exist. Profiles live under
        <code>bitos.space/p/</code>.
      </p>
      <p>
        <a href="/">Home</a> &nbsp;·&nbsp;
        <a href="/p/">Open profiles</a>
      </p>
    </main>
  </body>
</html>
